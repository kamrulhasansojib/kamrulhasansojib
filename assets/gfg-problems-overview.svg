<svg xmlns="http://www.w3.org/2000/svg" width="500" height="390" viewBox="0 0 500 390" role="img" aria-label="GeeksforGeeks Overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="499" height="389" fill="url(#bg)" stroke="#30363D"/>

  <text x="28" y="56" fill="#FFFFFF" font-size="20" font-weight="700"
        font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
    GeeksforGeeks
  </text>

  <!-- donut background -->
  <circle cx="135" cy="200" r="86" fill="none" stroke="#21262D" stroke-width="20"/>

  <!-- donut segments -->
  <g transform="rotate(-90 135 200)">

      <circle cx="135" cy="200" r="86" pathLength="100"
              fill="none" stroke="#CDEB8B" stroke-width="20"
              stroke-dasharray="100.000000 0.000000"
              stroke-dashoffset="-0.000000" />
  </g>

  <!-- center numbers -->
  <text x="135" y="198" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="800"
        font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
    1
  </text>
  <text x="135" y="226" text-anchor="middle" fill="#8B949E" font-size="14"
        font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
    Problems Solved
  </text>

  <!-- legend -->
  
    <rect x="300" y="133" width="14" height="14" rx="3" fill="#7EE7F9"/>
    <text x="322" y="145" fill="#C9D1D9" font-size="14"
          font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      School (0)
    </text>
    <rect x="300" y="167" width="14" height="14" rx="3" fill="#CDEB8B"/>
    <text x="322" y="179" fill="#C9D1D9" font-size="14"
          font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      Basic (1)
    </text>
    <rect x="300" y="201" width="14" height="14" rx="3" fill="#8BC34A"/>
    <text x="322" y="213" fill="#C9D1D9" font-size="14"
          font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      Easy (0)
    </text>
    <rect x="300" y="235" width="14" height="14" rx="3" fill="#FFA726"/>
    <text x="322" y="247" fill="#C9D1D9" font-size="14"
          font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      Medium (0)
    </text>
    <rect x="300" y="269" width="14" height="14" rx="3" fill="#FF7043"/>
    <text x="322" y="281" fill="#C9D1D9" font-size="14"
          font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      Hard (0)
    </text>
</svg>
