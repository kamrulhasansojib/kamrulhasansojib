<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400" role="img" aria-label="GeeksforGeeks Overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="499" height="399" fill="url(#bg)" stroke="#30363D"/>

  <!-- Logo -->
  
  <image href="data:image/png;base64," x="24" y="28" width="30" height="30" />

  <!-- Username -->
  <text x="64" y="52" fill="#FFFFFF" font-size="20" font-weight="900" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
    kamrulhasansojib19
  </text>

  <!-- Brand -->
  <text x="64" y="78" fill="#2F8D46" font-size="18" font-weight="900" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
    GeeksforGeeks
  </text>

  <!-- donut background -->
  <circle cx="155" cy="245" r="94" fill="none" stroke="#21262D" stroke-width="22"/>

  <!-- donut segments -->
  <g transform="rotate(-90 155 245)">

      <circle cx="155" cy="245" r="94" pathLength="100"
              fill="none" stroke="#CDEB8B" stroke-width="22"
              stroke-dasharray="50.000000 50.000000"
              stroke-dashoffset="-0.000000" />

      <circle cx="155" cy="245" r="94" pathLength="100"
              fill="none" stroke="#8BC34A" stroke-width="22"
              stroke-dasharray="50.000000 50.000000"
              stroke-dashoffset="-50.000000" />
  </g>

  <!-- center numbers -->
  <text x="155" y="239" text-anchor="middle" fill="#FFFFFF" font-size="50" font-weight="900" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
    2
  </text>
  <text x="155" y="275" text-anchor="middle" fill="#9AA4B2" font-size="17" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
    Problems Solved
  </text>

  <!-- legend -->
  
    <rect x="320" y="152" width="16" height="16" fill="#7EE7F9"/>
    <text x="344" y="165" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      School (0)
    </text>
    <rect x="320" y="186" width="16" height="16" fill="#CDEB8B"/>
    <text x="344" y="199" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      Basic (1)
    </text>
    <rect x="320" y="220" width="16" height="16" fill="#8BC34A"/>
    <text x="344" y="233" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      Easy (1)
    </text>
    <rect x="320" y="254" width="16" height="16" fill="#FFA726"/>
    <text x="344" y="267" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      Medium (0)
    </text>
    <rect x="320" y="288" width="16" height="16" fill="#FF7043"/>
    <text x="344" y="301" fill="#E6EDF3" font-size="17" font-weight="700" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
