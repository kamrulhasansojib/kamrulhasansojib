<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400" role="img" aria-label="GeeksforGeeks Overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="499" height="399" fill="url(#bg)" stroke="#30363D"/>

  <!-- GFG Logo (simple) -->
  <circle cx="40" cy="52" r="16" fill="#2F8D46" />
  <text x="40" y="58" text-anchor="middle" fill="#FFFFFF"
        font-size="14" font-weight="800"
        font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
    GFG
  </text>

  <!-- Username + Brand -->
  <text x="66" y="56" fill="#FFFFFF" font-size="18" font-weight="800"
        font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
    kamrulhasansojib19
  </text>
  <text x="66" y="80" fill="#2F8D46" font-size="16" font-weight="800"
        font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
    GeeksforGeeks
  </text>

  <!-- donut background -->
  <circle cx="145" cy="230" r="92" fill="none" stroke="#21262D" stroke-width="22"/>

  <!-- donut segments (start from top) -->
  <g transform="rotate(-90 145 230)">

      <circle cx="145" cy="230" r="92" pathLength="100"
              fill="none" stroke="#CDEB8B" stroke-width="22"
              stroke-dasharray="50.000000 50.000000"
              stroke-dashoffset="-0.000000" />

      <circle cx="145" cy="230" r="92" pathLength="100"
              fill="none" stroke="#8BC34A" stroke-width="22"
              stroke-dasharray="50.000000 50.000000"
              stroke-dashoffset="-50.000000" />
  </g>

  <!-- center numbers -->
  <text x="145" y="226" text-anchor="middle" fill="#FFFFFF" font-size="44" font-weight="900"
        font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
    2
  </text>
  <text x="145" y="260" text-anchor="middle" fill="#9AA4B2" font-size="16" font-weight="600"
        font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
    Problems Solved
  </text>

  <!-- legend -->
  
    <rect x="320" y="152" width="16" height="16" rx="2" fill="#7EE7F9"/>
    <text x="344" y="165" fill="#E6EDF3" font-size="16" font-weight="600"
          font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      School (0)
    </text>
    <rect x="320" y="186" width="16" height="16" rx="2" fill="#CDEB8B"/>
    <text x="344" y="199" fill="#E6EDF3" font-size="16" font-weight="600"
          font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      Basic (1)
    </text>
    <rect x="320" y="220" width="16" height="16" rx="2" fill="#8BC34A"/>
    <text x="344" y="233" fill="#E6EDF3" font-size="16" font-weight="600"
          font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      Easy (1)
    </text>
    <rect x="320" y="254" width="16" height="16" rx="2" fill="#FFA726"/>
    <text x="344" y="267" fill="#E6EDF3" font-size="16" font-weight="600"
          font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      Medium (0)
    </text>
    <rect x="320" y="288" width="16" height="16" rx="2" fill="#FF7043"/>
    <text x="344" y="301" fill="#E6EDF3" font-size="16" font-weight="600"
          font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu">
      Hard (0)
    </text>
</svg>
