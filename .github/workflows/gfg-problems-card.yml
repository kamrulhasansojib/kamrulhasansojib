name: Generate GFG Problems Overview Card (API)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate SVG from GFG API
        env:
          GFG_API_URL: "https://practiceapi.geeksforgeeks.org/api/latest/problems/topic-wise/counts/?categoryId=308,310,313,301,318,305,302,315,303,300,298,288,285,312,335,468,337,336,339,329,307,332,306,372,346"
          GFG_COOKIE_HEADER: ${{ secrets.GFG_COOKIE_HEADER }}
          GFG_USERNAME: "kamrulhasansojib19"
        run: |
          python scripts/gfg_api_overview_card.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/gfg-problems-overview.svg
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update GFG overview card (api)"
          git push
